# Main experiment configuration.
# The `band` field is calibrated by the pilot and then FROZEN as
# configs/frozen.yaml (committed before main runs); everything else is fixed
# in advance.

model_id: Qwen/Qwen3-4B
lens_repo: neuronpedia/jacobian-lens
lens_file: qwen3-4b/jlens/Salesforce-wikitext/Qwen3-4B_jacobian_lens.pt

datasets: [arith, gsm8k, math500, aime24]
n_gsm8k: 150
n_math500: 150            # stratified, 30 per level 1-5
problem_seed: 20260716
n_samples:
  aime24: 3               # 30 problems x 3 samples

arms: [control, jspace, random]
budgets: [0, 256, 512, 1024, 4096]   # thinking-token budgets; 0 = direct answer
band: medium                     # PLACEHOLDER - frozen after pilot calibration
selection: cosine                # PLACEHOLDER - 'cosine' or 'logit', frozen after pilot
k: 10
answer_max_tokens: 48   # constrained answer: forced 'The final answer is \\boxed{' prefix
batch_size: 16
base_seed: 0
out_path: results/main.jsonl
